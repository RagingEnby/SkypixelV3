[project]
name = "skypixelv3"
version = "3.0.0-alpha.1"
description = "A Discord bot for Hypixel SkyBlock item collectors"
authors = [{name="RagingEnby", email="contact@ragingenby.dev"}]
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.13.0,<1",
    "disnake>=2.11,<3",
    "mcstatus>=11.1.1,<15",
    "motor>=3.7.0,<4",
    "mutf8>=1.0.6,<2",
    "pymongo>=4.9,<5",
]

[project.scripts]
skypixel = "skypixel.app:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["skypixel", "nbt"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["nbt"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "G", "I", "UP", "B", "RUF", "BLE", "ASYNC", "S102"]

[tool.ruff.lint.per-file-ignores]
"skypixel/commands/owner.py" = ["S102"]
