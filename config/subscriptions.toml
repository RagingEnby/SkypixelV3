# Channels that receive each alert, and the text sent with it.
#
# Each [[section]] entry is one channel:
#   channel = the Discord channel ID, as a number (no quotes)
#   ping    = text sent with the alert, such as a role mention "<@&ROLE_ID>",
#             or "" for no text
#
# To add a subscriber, copy an entry into the section and change both values.
# To remove one, delete its three lines. Restart the bot to apply the change.
# The bot refuses to start if an entry is malformed, and logs a warning on
# startup for each channel it cannot find or post embeds in.
#
# Rank sections: rank.<rank> for youtube, staff, pig_plus_plus_plus, innit,
# events, mojang, or mcp. rank.special is required: ranks without their own
# section are sent there.
#
# Set SKYPIXEL_SUBSCRIPTIONS to read this file from another path.

